plugins { id 'com.android.application' }
def releaseKeyProps = new Properties()
def releaseKeyFile = rootProject.file('keystore.properties')
if (releaseKeyFile.exists()) {
 releaseKeyFile.withInputStream { releaseKeyProps.load(it) }
}
android {
 namespace 'gr.politeia.app'
 compileSdk 36
 defaultConfig {
  applicationId 'com.KDapps.politeia'
  minSdk 26
  targetSdk 36
  versionCode 5
  versionName '0.3'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  if (releaseKeyProps.containsKey('storeFile')) {
   release {
    storeFile file(releaseKeyProps['storeFile'])
    storePassword releaseKeyProps['storePassword']
    keyAlias releaseKeyProps['keyAlias']
    keyPassword releaseKeyProps['keyPassword']
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   debuggable false
   if (releaseKeyProps.containsKey('storeFile')) signingConfig signingConfigs.release
  }
 }
 lint { abortOnError true }
}
dependencies {
 implementation project(':core')
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
