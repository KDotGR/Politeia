name: Refresh 2027 party positions

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: party-positions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check refresh logic
        run: python3 -m unittest discover -s scripts -p test_party_positions.py
      - name: Refresh official sources
        run: python3 scripts/refresh_party_positions.py
      - name: Publish updated database
        run: |
          git add -- data/party-positions-2027/positions.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh 2027 party position sources'
          git push
